# Lo que el repositorio puede demostrar sin hipervisor: `./netlabs check` entero.
# Es el mismo comando que corre Joan en su máquina, así que un verde aquí y un verde
# allí significan lo mismo. Sin credenciales y sin red: no se habla con el sitio.
name: verificar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: netlabs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El motor sólo necesita PyYAML; yamllint se usa si está, y aquí está.
      - name: Preparar el intérprete
        run: python -m pip install --quiet --disable-pip-version-check pyyaml yamllint

      - name: Comprobar el repositorio
        run: ./netlabs check