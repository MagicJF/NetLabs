# PROPÓSITO:   esperar a que un invitado esté arrancado de verdad, sondeando su
#              estado por la API con un tope.
# INVARIANTES: el sondeo pasa por la puerta (`pve.yml`), no por un `uri` suelto: una
#              sola puerta al hipervisor. Si el tope se agota, se para con el estado
#              que leyó.
# VER:         AGENTS.md §2, §3.5

- name: "PVE · esperar a que {{ guest.name }} esté arrancado"
  include_tasks: pve.yml
  vars:
    pve_method: GET
    pve_path: "/nodes/{{ env.proxmox.node }}/{{ 'lxc' if guest.guest == 'lxc' else 'qemu' }}/{{ guest.vmid }}/status/current"
    pve_do: "leer el estado de {{ guest.name }}"
    pve_status: [200, 500]
    pve_until: "{{ pve_r.json.data.status | default('') == 'running' }}"
    pve_retries: "{{ pve_estado_intentos | default(45) }}"
    pve_delay: 2

- name: "{{ guest.name }} no llegó a arrancar"
  ansible.builtin.assert:
    that:
      - pve_r.json.data.status | default('') == 'running'
    fail_msg: >-
      {{ guest.name }} ({{ guest.vmid }}) sigue en estado
      {{ pve_r.json.data.status | default('desconocido') }} después de esperar.
      El motor no sigue con un invitado que no está en pie.
