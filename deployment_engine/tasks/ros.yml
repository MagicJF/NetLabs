# PROPÓSITO:   la única puerta a RouterOS: su REST, por la red de gestión. Nada de
#              sesiones SSH al router, y nada de pasar de un lado a otro por dentro.
# INVARIANTES: se lee el interior antes de escribir; lo que se escribe son las
#              llamadas que calcula `netlabs_ros_ops`, nunca una lista escrita a mano.
#              El área declarada es la frontera: dentro se quita lo que sobra, fuera no
#              se entra. La clave NO se escribe aquí: se resuelve del nombre que
#              declara el laboratorio (`password_from`) contra secrets.yml.
# VER:         docs/diseno.md §4.4, §6

# El laboratorio nombra la credencial; el valor vive en secrets.yml. Se resuelve una
# vez por router: si el nombre no apunta a ninguna clave, se para aquí con el nombre
# delante, en vez de fallar más tarde en el login sin decir de dónde salía.
- name: "RouterOS · resolver la clave declarada para {{ router.name }}"
  ansible.builtin.set_fact:
    ros_clave: "{{ router | netlabs_ros_clave(secrets) }}"
  # El valor es una credencial: sin `no_log` sale en la salida detallada de Ansible
  # —y `netlabs` la guarda en logs/— cada vez que se resuelve. Se calla la tarea
  # entera, como ya se hace con la clave del servicio de gestión.
  no_log: true

# La clave del router no puede ponerla el script de arranque: el agente ejecuta con
# una política sin `sensitive` y `/user set` falla con "not enough permissions (9)"
# (medido). La pone aquí la primera sesión REST, que corre con la política completa.
# Sólo se toca cuando la clave del secreto NO entra: si ya entra, no se escribe nada.
- name: "RouterOS · comprobar la clave de {{ router.name }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}/rest/system/identity"
    method: GET
    url_username: "{{ ros_user }}"
    url_password: "{{ ros_clave }}"
    force_basic_auth: true
    status_code: [200, 401]
    timeout: 30
  register: ros_login
  changed_when: false
  # El arranque acaba de mover la dirección de gestión: el REST puede tardar unos
  # segundos en contestar. Se sondea con tope, no se da por caído al primer intento.
  failed_when: false
  # Agotar los reintentos marca la tarea como fallida aunque `failed_when` sea falso
  # (medido, y `ignore_errors` sí vale sobre un `uri`): sin esto, el play se pararía aquí
  # y la aserción de más abajo —la que dice que no hay camino hasta el router— no llegaría
  # a hablar, que es justo el mensaje que se pagó una tarde por no tener.
  ignore_errors: true
  until: ros_login.status in [200, 401]
  retries: 20
  delay: 3

- name: "RouterOS · poner la clave inicial de {{ router.name }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}/rest/user/*1"
    method: PATCH
    url_username: "{{ ros_user }}"
    url_password: ""
    force_basic_auth: true
    body_format: json
    body: {password: "{{ ros_clave }}"}
    # Al cambiar su propia clave, RouterOS cierra la sesión y responde 400
    # "Session closed" aunque el cambio sí se aplicó (medido).
    status_code: [200, 204, 400]
    timeout: 30
  when: ros_login.status == 401

- name: "RouterOS · la clave del secreto tiene que entrar en {{ router.name }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}/rest/system/identity"
    method: GET
    url_username: "{{ ros_user }}"
    url_password: "{{ ros_clave }}"
    force_basic_auth: true
    status_code: [200, 401]
    timeout: 30
  register: ros_login_ok
  changed_when: false
  failed_when: false
  # Lo mismo que en el sondeo de arriba: el tope agotado no puede parar el play antes de
  # las aserciones, que son las que dicen qué pasó y por dónde mirar.
  ignore_errors: true
  until: ros_login_ok.status in [200, 401]
  retries: 10
  delay: 3

# Un `-1` no es una credencial rechazada: es que no hubo ni conexión. Decirlo con el
# mensaje de la clave manda a mirar el router cuando el problema estaba en el camino
# —el reenvío no escuchaba—, que es por donde se perdió una tarde.
- name: "RouterOS · sin camino hasta {{ router.name }} no se puede ni preguntar"
  ansible.builtin.assert:
    that: ros_login_ok.status in [200, 401]
    fail_msg: >-
      no hay camino hasta {{ router.name }}: el reenvío
      {{ router.vmid | netlabs_tunnel_port }} no contesta
      ({{ ros_login_ok.status | default('sin respuesta') }}). No es la clave: es que
      no se llegó a preguntar. Mira el reenvío y la dirección de gestión del invitado.

- name: "RouterOS · sin la clave del secreto no se entra: se para"
  ansible.builtin.assert:
    that: ros_login_ok.status == 200
    fail_msg: >-
      {{ ros_user }} no entra en {{ router.name }} con la clave del secreto
      (HTTP {{ ros_login_ok.status | default('sin respuesta') }}). El arranque no
      pudo ponerla y el motor no sigue por un camino que no puede autenticar.

# Una lectura que falla —un HTTP 403, verbigracia— para el play. El `no_log` oculta el
# cuerpo, que trae las claves de `/rest/snmp/community` y `/rest/user`, pero con él calla
# también la ruta y el estado, y entonces el informe no dice qué lectura ni por qué. La
# regla prohíbe la credencial, no la ruta: se envuelve en un bloque que, al fallar, rescata
# y nombra ruta y estado HTTP —nunca el cuerpo— antes de volver a parar.
- name: "RouterOS · leer el interior de {{ router.name }}"
  block:
    - name: "RouterOS · leer el interior de {{ router.name }}"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}{{ ros_lectura.ruta }}"
        method: GET
        url_username: "{{ ros_user }}"
        url_password: "{{ ros_clave }}"
        force_basic_auth: true
        status_code: [200]
        timeout: 30
      # El nombre del bucle no puede ser `item`: este fichero se incluye con un `item`
      # del llamante y el bucle interno lo pisaría (el `router` se volvería una cadena).
      loop: "{{ router | netlabs_ros_reads }}"
      loop_control:
        loop_var: ros_lectura
        label: "{{ ros_lectura.ruta }}"
      register: ros_lecturas
      changed_when: false
      # Lo leído incluye `/rest/snmp/community`, cuyas entradas v3 traen las claves; y `/rest/user`.
      # Con `-v` la salida detallada imprimiría esos cuerpos y el lanzador los guardaría en logs/.
      # Se calla la tarea entera —el diagnóstico de qué se leyó no aporta nada que no diga `effect`—.
      no_log: true
  rescue:
    # Sin `no_log`: sólo se nombran la ruta y el estado de cada lectura fallida, jamás el campo
    # de respuesta. Es el diagnóstico que la regla permite y que el `no_log` de arriba se llevaba.
    - name: "RouterOS · decir qué lectura del interior de {{ router.name }} falló"
      ansible.builtin.debug:
        msg: >-
          {{ router.name }} no contestó a alguna lectura del interior. Ruta y estado
          HTTP de las que fallaron:
          {{ ros_lecturas.results | rejectattr('status', 'equalto', 200)
             | map(attribute='ros_lectura') | map(attribute='ruta') | list }} —
          {{ ros_lecturas.results | rejectattr('status', 'equalto', 200)
             | map(attribute='status') | list }}.
    - name: "RouterOS · sin leer el interior de {{ router.name }} no se sigue"
      ansible.builtin.fail:
        msg: "{{ router.name }}: lectura del interior fallida; la ruta y el estado están arriba."

- name: "RouterOS · ordenar lo leído"
  # Lo leído se ordena por la clave que trae cada lectura, no por el orden en que
  # salieron: un diccionario montado sobre dos listas paralelas miente en cuanto una se
  # descuadra, y entonces el motor ve un equipo vacío y le propone escribir lo que ya
  # tiene (y RouterOS le contesta «already have»).
  ansible.builtin.set_fact:
    ros_current: >-
      {{ dict(ros_lecturas.results | map(attribute='ros_lectura') | map(attribute='clave')
              | zip(ros_lecturas.results | map(attribute='json') | list)) }}
  # `ros_current` es lo leído, con las claves de `/rest/snmp/community` dentro: un `set_fact`
  # sin `no_log` imprime el hecho entero con `-v` y el lanzador lo guarda en logs/.
  no_log: true

- name: "RouterOS · calcular la diferencia de {{ router.name }}"
  ansible.builtin.set_fact:
    ros_ops: "{{ router | netlabs_ros_ops(ros_current, ros_clave, secrets, env.management.address_space, env.observabilidad | default({})) }}"
  # `ros_ops` lleva el cuerpo de cada escritura, y una escritura —el alta de usuario, o la
  # identidad SNMP v3— contiene la clave: sin `no_log` el hecho entero se imprime con `-v` y
  # el lanzador lo guarda en logs/. El diagnóstico no se pierde: la tarea de abajo enseña la
  # diferencia por su `effect`, que nunca nombra una clave.
  no_log: true

- name: "RouterOS · enseñar la diferencia de {{ router.name }}"
  ansible.builtin.debug:
    msg: "{{ ros_ops | map(attribute='effect') | list }}"
  when: ros_ops | length > 0

- name: "RouterOS · escribir en {{ router.name }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}{{ ros_op.path }}"
    method: "{{ ros_op.method }}"
    url_username: "{{ ros_user }}"
    url_password: "{{ ros_clave }}"
    force_basic_auth: true
    # Con `body_format: json` y sin cuerpo, el módulo manda el literal `null` como
    # cuerpo del DELETE —comprobado leyendo la petición—, y RouterOS no contesta a un
    # DELETE con cuerpo: la conexión se queda colgada hasta el tope y el apply se para
    # con un «Connection failure: timed out» que no dice nada del laboratorio. El
    # formato se pide sólo cuando hay cuerpo que mandar.
    body_format: "{{ 'json' if ros_op.body is defined else omit }}"
    body: "{{ ros_op.body | default(omit) }}"
    status_code: [200, 201, 204]
    timeout: 30
  # Las que esperan a que las demás hayan terminado no van aquí: van en el paso de
  # abajo. Ver el porqué en el comentario de ese paso.
  loop: "{{ ros_ops | rejectattr('tras_restricciones', 'defined') | list }}"
  loop_control:
    loop_var: ros_op
    label: "{{ ros_op.effect }}"
  # El cuerpo de una escritura lleva la clave del router (alta de usuario), y el
  # informe del apply acaba en logs/: sin `no_log` esa clave queda escrita en disco.
  # El diagnóstico no se pierde —qué recurso y qué operación—: lo imprime la tarea de
  # arriba, que enseña la diferencia; lo único que se calla es el cuerpo.
  no_log: true
  # Sólo se emite una llamada cuando hay diferencia, así que cada una es un cambio
  # de verdad. El módulo `uri` no lo marca por su cuenta y el `changed` del apply
  # tiene que decir la verdad: si escribió, cambió.
  changed_when: ros_op.method != 'GET'
  # Un DELETE a RouterOS se aplica pero su respuesta no siempre vuelve: la petición
  # muere en el tope y el `uri` devuelve -1. El borrado sí ocurrió —se comprueba
  # abajo, releyendo—, así que no se da por fallo aquí; lo que no quede aplicado lo
  # canta la comprobación de después.
  register: ros_escritura
  failed_when: >-
    (ros_escritura.status | default(0)) not in [200, 201, 204] and
    not (ros_escritura.status | default(0) == -1 and ros_op.method == 'DELETE')

# El encendido de SNMP, en su propio paso y sólo después de que el anterior haya
# terminado entero. No basta con ponerlo el último de la lista: una llamada que falla
# NO detiene el bucle —Ansible recorre todos los elementos y falla al final (medido)—,
# así que el encendido llegaría igual con una comunidad abierta a `::/0`. Aquí, si una
# restricción falla, el play se para antes de encender y el servicio queda apagado,
# que es el fallo inocuo; encendido y abierto es el que no se admite.
- name: "RouterOS · encender SNMP en {{ router.name }} con la comunidad ya acotada"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}{{ ros_op.path }}"
    method: "{{ ros_op.method }}"
    url_username: "{{ ros_user }}"
    url_password: "{{ ros_clave }}"
    force_basic_auth: true
    # Con `body_format: json` y sin cuerpo, el módulo manda el literal `null` como
    # cuerpo del DELETE —comprobado leyendo la petición—, y RouterOS no contesta a un
    # DELETE con cuerpo: la conexión se queda colgada hasta el tope y el apply se para
    # con un «Connection failure: timed out» que no dice nada del laboratorio. El
    # formato se pide sólo cuando hay cuerpo que mandar.
    body_format: "{{ 'json' if ros_op.body is defined else omit }}"
    body: "{{ ros_op.body | default(omit) }}"
    status_code: [200, 201, 204]
    timeout: 30
  loop: "{{ ros_ops | selectattr('tras_restricciones', 'defined') | list }}"
  loop_control:
    loop_var: ros_op
    label: "{{ ros_op.effect }}"
  no_log: true
  changed_when: ros_op.method != 'GET'
  register: ros_escritura_tardia
  failed_when: >-
    (ros_escritura_tardia.status | default(0)) not in [200, 201, 204] and
    not (ros_escritura_tardia.status | default(0) == -1 and ros_op.method == 'DELETE')

# Y se lee de vuelta para no dar por bueno lo que no se puede comprobar: si una
# escritura se perdió —o el borrado no llegó a ocurrir—, la diferencia seguirá ahí y
# el apply se para con su nombre y apellidos en vez de decir que fue bien.
- name: "RouterOS · releer el interior de {{ router.name }} tras escribir"
  block:
    - name: "RouterOS · releer el interior de {{ router.name }} tras escribir"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}{{ ros_lectura.ruta }}"
        method: GET
        url_username: "{{ ros_user }}"
        url_password: "{{ ros_clave }}"
        force_basic_auth: true
        status_code: [200]
        timeout: 30
      loop: "{{ router | netlabs_ros_reads }}"
      loop_control:
        loop_var: ros_lectura
        label: "{{ ros_lectura.ruta }}"
      register: ros_relecturas
      changed_when: false
      # Como la primera lectura: lo releído trae los cuerpos de `/rest/snmp/community` y `/rest/user`,
      # con sus claves. Sin `no_log`, la salida detallada con `-v` los imprimiría y el lanzador los
      # guardaría en logs/.
      no_log: true
  rescue:
    # Igual que en la primera lectura: `no_log` no puede llevarse por delante la ruta ni el estado
    # de la relectura fallida. Se nombran los dos sin tocar el campo de respuesta y se vuelve a parar.
    - name: "RouterOS · decir qué relectura del interior de {{ router.name }} falló"
      ansible.builtin.debug:
        msg: >-
          {{ router.name }} no contestó a alguna relectura del interior. Ruta y estado
          HTTP de las que fallaron:
          {{ ros_relecturas.results | rejectattr('status', 'equalto', 200)
             | map(attribute='ros_lectura') | map(attribute='ruta') | list }} —
          {{ ros_relecturas.results | rejectattr('status', 'equalto', 200)
             | map(attribute='status') | list }}.
    - name: "RouterOS · sin releer el interior de {{ router.name }} no se da nada por bueno"
      ansible.builtin.fail:
        msg: "{{ router.name }}: relectura del interior fallida; la ruta y el estado están arriba."

- name: "RouterOS · lo que se dijo y no quedó en {{ router.name }}"
  ansible.builtin.set_fact:
    ros_resto: >-
      {{ router | netlabs_ros_ops(dict(ros_relecturas.results
           | map(attribute='ros_lectura') | map(attribute='clave') | zip(ros_relecturas.results | map(attribute='json')
           | list)), ros_clave, secrets, env.management.address_space,
           env.observabilidad | default({})) }}
  # `ros_resto` es otra diferencia calculada: lleva los mismos cuerpos con clave que `ros_ops`.
  # Se calla el hecho; lo que se dice en voz alta —si queda algo— es su `effect`, más abajo.
  no_log: true

- name: "RouterOS · dar el cambio por bueno sólo si de verdad está en {{ router.name }}"
  ansible.builtin.assert:
    that:
      - ros_resto | length == 0
    fail_msg: >-
      {{ router.name }} contestó a las escrituras pero la diferencia sigue ahí:
      {{ ros_resto | map(attribute='effect') | list | join('; ') }}. El motor no da por
      bueno un cambio que no puede leer de vuelta.

- name: "RouterOS · comprobar que lo declarado está de verdad en {{ router.name }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}/rest/ip/address"
    method: GET
    url_username: "{{ ros_user }}"
    url_password: "{{ ros_clave }}"
    force_basic_auth: true
    status_code: [200]
    timeout: 30
  register: ros_direcciones
  changed_when: false

- name: "RouterOS · la comprobación no puede ser vacía"
  ansible.builtin.assert:
    that:
      - ros_direcciones.json | length > 0
      - >-
        (router.configure.addresses | default([]) | map(attribute='address') | list)
        | difference(ros_direcciones.json | map(attribute='address') | list) | length == 0
    fail_msg: >-
      Después de escribir, {{ router.name }} no tiene todas las direcciones declaradas:
      {{ ros_direcciones.json | map(attribute='address') | list }}. El motor no da por
      bueno un cambio que no puede leer de vuelta.
