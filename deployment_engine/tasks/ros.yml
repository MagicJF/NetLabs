# PROPÓSITO:   la única puerta a RouterOS: su REST, por la red de gestión. Nada de
#              sesiones SSH al router, y nada de pasar de un lado a otro por dentro.
# INVARIANTES: se lee el interior antes de escribir; lo que se escribe son las
#              llamadas que calcula `netlabs_ros_ops`, nunca una lista escrita a mano.
#              El área declarada es la frontera: dentro se quita lo que sobra, fuera no
#              se entra. La clave NO se escribe aquí: se resuelve del nombre que
#              declara el laboratorio (`password_from`) contra secrets.yml.
# VER:         docs/diseno.md §4.4, §6

# El laboratorio nombra la credencial; el valor vive en secrets.yml. Se resuelve una
# vez por router: si el nombre no apunta a ninguna clave, se para aquí con el nombre
# delante, en vez de fallar más tarde en el login sin decir de dónde salía.
- name: "RouterOS · resolver la clave declarada para {{ router.name }}"
  ansible.builtin.set_fact:
    ros_clave: "{{ router | netlabs_ros_clave(secrets) }}"
  # El valor es una credencial: sin `no_log` sale en la salida detallada de Ansible
  # —y `netlabs` la guarda en logs/— cada vez que se resuelve. Se calla la tarea
  # entera, como ya se hace con la clave del servicio de gestión.
  no_log: true

# La clave del router no puede ponerla el script de arranque: el agente ejecuta con
# una política sin `sensitive` y `/user set` falla con "not enough permissions (9)"
# (medido). La pone aquí la primera sesión REST, que corre con la política completa.
# Sólo se toca cuando la clave del secreto NO entra: si ya entra, no se escribe nada.
- name: "RouterOS · comprobar la clave de {{ router.name }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}/rest/system/identity"
    method: GET
    url_username: "{{ ros_user }}"
    url_password: "{{ ros_clave }}"
    force_basic_auth: true
    status_code: [200, 401]
    timeout: 30
  register: ros_login
  changed_when: false
  # El arranque acaba de mover la dirección de gestión: el REST puede tardar unos
  # segundos en contestar. Se sondea con tope, no se da por caído al primer intento.
  failed_when: false
  until: ros_login.status in [200, 401]
  retries: 20
  delay: 3

- name: "RouterOS · poner la clave inicial de {{ router.name }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}/rest/user/*1"
    method: PATCH
    url_username: "{{ ros_user }}"
    url_password: ""
    force_basic_auth: true
    body_format: json
    body: {password: "{{ ros_clave }}"}
    # Al cambiar su propia clave, RouterOS cierra la sesión y responde 400
    # "Session closed" aunque el cambio sí se aplicó (medido).
    status_code: [200, 204, 400]
    timeout: 30
  when: ros_login.status == 401

- name: "RouterOS · la clave del secreto tiene que entrar en {{ router.name }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}/rest/system/identity"
    method: GET
    url_username: "{{ ros_user }}"
    url_password: "{{ ros_clave }}"
    force_basic_auth: true
    status_code: [200, 401]
    timeout: 30
  register: ros_login_ok
  changed_when: false
  failed_when: false
  until: ros_login_ok.status in [200, 401]
  retries: 10
  delay: 3

- name: "RouterOS · sin la clave del secreto no se entra: se para"
  ansible.builtin.assert:
    that: ros_login_ok.status == 200
    fail_msg: >-
      {{ ros_user }} no entra en {{ router.name }} con la clave del secreto
      (HTTP {{ ros_login_ok.status | default('sin respuesta') }}). El arranque no
      pudo ponerla y el motor no sigue por un camino que no puede autenticar.

- name: "RouterOS · leer el interior de {{ router.name }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}{{ ros_lectura }}"
    method: GET
    url_username: "{{ ros_user }}"
    url_password: "{{ ros_clave }}"
    force_basic_auth: true
    status_code: [200]
    timeout: 30
  # El nombre del bucle no puede ser `item`: este fichero se incluye con un `item`
  # del llamante y el bucle interno lo pisaría (el `router` se volvería una cadena).
  loop: "{{ router | netlabs_ros_reads }}"
  loop_control:
    loop_var: ros_lectura
    label: "{{ ros_lectura }}"
  register: ros_lecturas
  changed_when: false

- name: "RouterOS · ordenar lo leído"
  ansible.builtin.set_fact:
    ros_current: >-
      {{ dict(ros_claves | zip(ros_lecturas.results | map(attribute='json') | list)) }}
  vars:
    ros_claves: [identity, addresses, pools, dhcp_servers, dhcp_networks, services, users, snmp, snmp_community, bridges, bridge_ports]

- name: "RouterOS · calcular la diferencia de {{ router.name }}"
  ansible.builtin.set_fact:
    ros_ops: "{{ router | netlabs_ros_ops(ros_current, ros_clave, secrets, env.management.address_space) }}"

- name: "RouterOS · enseñar la diferencia de {{ router.name }}"
  ansible.builtin.debug:
    msg: "{{ ros_ops | map(attribute='effect') | list }}"
  when: ros_ops | length > 0

- name: "RouterOS · escribir en {{ router.name }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}{{ ros_op.path }}"
    method: "{{ ros_op.method }}"
    url_username: "{{ ros_user }}"
    url_password: "{{ ros_clave }}"
    force_basic_auth: true
    body_format: json
    body: "{{ ros_op.body | default(omit) }}"
    status_code: [200, 201, 204]
    timeout: 30
  # Las que esperan a que las demás hayan terminado no van aquí: van en el paso de
  # abajo. Ver el porqué en el comentario de ese paso.
  loop: "{{ ros_ops | rejectattr('tras_restricciones', 'defined') | list }}"
  loop_control:
    loop_var: ros_op
    label: "{{ ros_op.effect }}"
  # El cuerpo de una escritura lleva la clave del router (alta de usuario), y el
  # informe del apply acaba en logs/: sin `no_log` esa clave queda escrita en disco.
  # El diagnóstico no se pierde —qué recurso y qué operación—: lo imprime la tarea de
  # arriba, que enseña la diferencia; lo único que se calla es el cuerpo.
  no_log: true
  # Sólo se emite una llamada cuando hay diferencia, así que cada una es un cambio
  # de verdad. El módulo `uri` no lo marca por su cuenta y el `changed` del apply
  # tiene que decir la verdad: si escribió, cambió.
  changed_when: ros_op.method != 'GET'

# El encendido de SNMP, en su propio paso y sólo después de que el anterior haya
# terminado entero. No basta con ponerlo el último de la lista: una llamada que falla
# NO detiene el bucle —Ansible recorre todos los elementos y falla al final (medido)—,
# así que el encendido llegaría igual con una comunidad abierta a `::/0`. Aquí, si una
# restricción falla, el play se para antes de encender y el servicio queda apagado,
# que es el fallo inocuo; encendido y abierto es el que no se admite.
- name: "RouterOS · encender SNMP en {{ router.name }} con la comunidad ya acotada"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}{{ ros_op.path }}"
    method: "{{ ros_op.method }}"
    url_username: "{{ ros_user }}"
    url_password: "{{ ros_clave }}"
    force_basic_auth: true
    body_format: json
    body: "{{ ros_op.body | default(omit) }}"
    status_code: [200, 201, 204]
    timeout: 30
  loop: "{{ ros_ops | selectattr('tras_restricciones', 'defined') | list }}"
  loop_control:
    loop_var: ros_op
    label: "{{ ros_op.effect }}"
  no_log: true
  changed_when: ros_op.method != 'GET'

- name: "RouterOS · comprobar que lo declarado está de verdad en {{ router.name }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ router.vmid | netlabs_tunnel_port }}/rest/ip/address"
    method: GET
    url_username: "{{ ros_user }}"
    url_password: "{{ ros_clave }}"
    force_basic_auth: true
    status_code: [200]
    timeout: 30
  register: ros_direcciones
  changed_when: false

- name: "RouterOS · la comprobación no puede ser vacía"
  ansible.builtin.assert:
    that:
      - ros_direcciones.json | length > 0
      - >-
        (router.configure.addresses | default([]) | map(attribute='address') | list)
        | difference(ros_direcciones.json | map(attribute='address') | list) | length == 0
    fail_msg: >-
      Después de escribir, {{ router.name }} no tiene todas las direcciones declaradas:
      {{ ros_direcciones.json | map(attribute='address') | list }}. El motor no da por
      bueno un cambio que no puede leer de vuelta.
