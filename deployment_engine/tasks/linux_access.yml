# PROPÓSITO:   abrir la puerta de root de un invitado Linux para que la consola de
#              la vista pueda abrir su terminal como abre la de un RouterOS.
# INVARIANTES: se entra con la clave pública que el motor dejó autorizada al crear
#              el invitado; la contraseña viaja por la entrada estándar y nunca
#              aparece en la línea de órdenes.
#              La segunda pasada no escribe: el script compara su marca y contesta
#              `CAMBIO:0`.
# VER:         docs/diseno.md §3.4, §4.3; docs/decisiones/0009

- name: "SSH · abrir la puerta de {{ linux_nodo.name }}"
  include_tasks: interior_ssh.yml
  vars:
    interior_descripcion: "abrir la puerta de {{ linux_nodo.name }}"
    interior_salto: true
    interior_escribe: true
    interior_cambia_salida: true
    interior_secreto: "{{ secrets.linux_clave }}"
    interior_imprime: false
    comando: "{{ publica | netlabs_linux_access_cmd(secrets.linux_clave) }}"
