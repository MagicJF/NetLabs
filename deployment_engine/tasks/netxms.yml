# PROPÓSITO:   la quinta vía: registrar cada equipo de red del laboratorio en lo que
#              observa el sitio (NetXMS) con su usuario y su clave, para que quien mira
#              lo vea y pueda abrir su terminal desde la consola sin teclear nada.
#              Es una conversación con su API: entrar, leer el censo de equipos, pedir
#              la ficha de los que ya están y dar de alta los que faltan.
# INVARIANTES: se llama con `curl` desde DENTRO del invitado de gestión —su API sólo
#              escucha ahí, y el túnel del motor aterriza ahí— por la puerta de siempre
#              (interior_ssh.yml: SSH a su dirección, sin salto).
#              Ni la clave ni el testigo de la sesión viajan en la línea de órdenes: van
#              por la entrada estándar. Ninguna respuesta que traiga una credencial se
#              imprime (`interior_imprime: false`), así que el informe queda sin claves.
#              Sólo se escribe la diferencia: se dan de alta los que faltan. Un equipo
#              que ya está con OTRAS credenciales no se toca —el API de esta versión sólo
#              las acepta al crearlo— y se dice en voz alta (`pendientes`) en vez de
#              fingir que se arregló.
# VER:         docs/diseno.md §2.8 (las cinco vías), §3.4, §7;
#              docs/decisiones/0003-registrar-los-equipos-en-la-vista.md

- name: netxms · el sitio declara dónde está el API de su servicio de gestión
  ansible.builtin.fail:
    msg: >-
      `netlabs.yml` no declara `management.api`: es la dirección del API del servicio de
      gestión **tal y como se ve desde dentro de su invitado** (ahí aterriza el túnel del
      motor), y sin ella no hay forma de registrar los equipos del laboratorio. Pon algo
      como `api: http://127.0.0.1:8000/v1` dentro de `management`.
  when: (env.management.api | default('')) | length == 0

- name: netxms · el sitio declara la credencial de su servicio de gestión
  ansible.builtin.fail:
    msg: >-
      `secrets.yml` no tiene `credenciales.{{ env.management.guest }}`: la credencial del
      servicio de gestión se nombra por el nombre del invitado que lo declara
      (`netlabs.yml` → `management.guest`) y su valor vive en `secrets.yml`, nunca en el
      laboratorio ni en el motor.
  when: secrets.credenciales[env.management.guest] is not defined

# El usuario y la clave del API, resueltos una vez. No se imprimen: son la credencial
# de administración del servicio.
- name: netxms · de dónde se entra y con qué
  ansible.builtin.set_fact:
    netxms_api: "{{ env.management.api }}"
    netxms_usuario: >-
      {{ secrets.credenciales[env.management.guest].usuario
         if secrets.credenciales[env.management.guest] is mapping else 'admin' }}
    netxms_clave: >-
      {{ secrets.credenciales[env.management.guest].clave
         if secrets.credenciales[env.management.guest] is mapping
         else secrets.credenciales[env.management.guest] }}
  no_log: true

# --- entrar ----------------------------------------------------------------
# El cuerpo del login —usuario y clave— entra por la entrada estándar, nunca por la
# línea de órdenes. La respuesta trae el testigo de la sesión: no se imprime.
- name: netxms · entrar por el API del servicio de gestión
  include_tasks: interior_ssh.yml
  vars:
    interior_descripcion: "netxms · entrar por el API"
    interior_salto: false
    objetivo: 127.0.0.1
    interior_escribe: false
    interior_secreto: "{{ netxms_usuario | netlabs_netxms_login_cuerpo(netxms_clave) }}"
    interior_imprime: false
    comando: "{{ netxms_api | netlabs_netxms_login_cmd }}"

- name: netxms · la respuesta del API
  ansible.builtin.set_fact:
    netxms_respuesta: "{{ interior.stdout | default('{}', true) | from_json }}"
  no_log: true

- name: netxms · el testigo de la sesión
  ansible.builtin.set_fact:
    netxms_testigo: "{{ netxms_respuesta.token | default('', true) }}"
  no_log: true

- name: netxms · el API no dejó entrar
  ansible.builtin.fail:
    msg: >-
      El API del servicio de gestión ({{ netxms_api }}) no devolvió una sesión:
      {{ interior.stdout | default('(sin respuesta)', true) | trim }}. El usuario y la
      clave salen de `secrets.yml` (`credenciales.{{ env.management.guest }}`), y el
      servicio tiene que estar en pie: `./netlabs apply a_bootstrap`.
  when: netxms_testigo | length == 0

# --- leer lo que la vista ya tiene ----------------------------------------
# Dos lecturas y no una: el censo dice QUÉ equipos hay (sin credenciales), y la ficha
# de cada uno dice CÓMO están. Se piden sólo las fichas de los equipos de este
# laboratorio, de una vez —leer las de todos los laboratorios para escribir uno sería
# leer de más—.
- name: netxms · leer el censo de equipos de la vista
  include_tasks: interior_ssh.yml
  vars:
    interior_descripcion: "netxms · leer el censo de equipos"
    interior_salto: false
    objetivo: 127.0.0.1
    interior_escribe: false
    interior_secreto: "{{ netxms_testigo }}\n{{ netxms_api | netlabs_netxms_censo_cuerpo }}"
    interior_imprime: false
    comando: "{{ netxms_api | netlabs_netxms_censo_cmd }}"

- name: netxms · el censo que devolvió la vista
  ansible.builtin.set_fact:
    netxms_censo: "{{ interior.stdout | default('[]', true) | from_json }}"
  no_log: true

- name: netxms · los equipos de este laboratorio que ya están en la vista
  ansible.builtin.set_fact:
    netxms_ids: "{{ equipos | netlabs_netxms_ids(netxms_censo) }}"
  no_log: true

- name: netxms · leer la ficha de los equipos que ya están
  include_tasks: interior_ssh.yml
  vars:
    interior_descripcion: "netxms · leer {{ netxms_ids | length }} ficha(s)"
    interior_salto: false
    objetivo: 127.0.0.1
    interior_escribe: false
    interior_secreto: "{{ netxms_testigo }}\n{{ netxms_ids | netlabs_netxms_fichas_cuerpo(netxms_api) }}"
    interior_imprime: false
    comando: "{{ netxms_api | netlabs_netxms_fichas_cmd }}"
  when: netxms_ids | length > 0

- name: netxms · las fichas que devolvió la vista
  ansible.builtin.set_fact:
    netxms_fichas: "{{ (interior.stdout | default('{}', true) | from_json).objects | default([], true) }}"
  no_log: true
  when: netxms_ids | length > 0

# --- escribir la diferencia ------------------------------------------------
- name: netxms · la diferencia entre lo declarado y lo que la vista ya tiene
  ansible.builtin.set_fact:
    netxms_plan: >-
      {{ equipos | netlabs_netxms_ops(netxms_censo, netxms_fichas | default([], true),
                                      netxms_api, secrets) }}
  no_log: true

- name: netxms · lo que hay que dar de alta
  ansible.builtin.debug:
    msg: "{{ netxms_plan.ops | map(attribute='effect') | list }}"
  when: netxms_plan.ops | length > 0

- name: netxms · dar de alta los equipos que faltan
  include_tasks: interior_ssh.yml
  vars:
    interior_descripcion: "netxms · {{ netxms_op.effect }}"
    interior_salto: false
    objetivo: 127.0.0.1
    interior_escribe: true
    # El cuerpo lleva la clave del equipo: entra por la entrada estándar.
    interior_secreto: "{{ netxms_testigo }}\n{{ netxms_op.cuerpo }}"
    interior_imprime: false
    comando: "{{ netxms_op.cmd }}"
  loop: "{{ netxms_plan.ops }}"
  loop_control: {loop_var: netxms_op, label: "{{ netxms_op.effect }}"}
  # El cuerpo del alta lleva la clave del equipo y el testigo de la sesión: con el
  # informe detallado, ambos acabarían en logs/. La tarea incluida ya calla su salida
  # —lleva `interior_secreto`—, pero el valor pasa por esta tarea de bucle, y por eso
  # la tarea entera se calla también. El diagnóstico queda en «lo que hay que dar de
  # alta», que imprime el efecto de cada alta y no su cuerpo.
  no_log: true
  when: netxms_plan.ops | length > 0

# Un equipo que ya está con otras credenciales no se puede corregir por el API: se
# dice, con su nombre y su dirección, para que se pueda hacer a mano. Un silencio aquí
# sería la mentira que este fichero evita.
- name: netxms · equipos que ya estaban con otras credenciales
  ansible.builtin.debug:
    msg: "{{ netxms_plan.pendientes }}"
  when: netxms_plan.pendientes | length > 0
