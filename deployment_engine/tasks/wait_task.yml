# PROPÓSITO:   esperar a una tarea del hipervisor sin dormir a ciegas: se sondea su
#              estado con un tope y, si el tope se agota, es un fallo.
# INVARIANTES: el tope se declara siempre; no hay `sleep` fijo.
# VER:         AGENTS.md §3.5

- name: "PVE · esperar a la tarea {{ pve_do | default('') }}"
  ansible.builtin.uri:
    url: "https://{{ secrets.pve_nodo }}:{{ secrets.pve_puerto }}/api2/json/nodes/{{ env.proxmox.node }}/tasks/{{ upid | urlencode }}/status"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ secrets.pve_token_id }}={{ secrets.pve_token_secreto }}"
    validate_certs: "{{ env.proxmox.verify_tls }}"
    status_code: [200]
    timeout: 30
  register: pve_tarea
  until: pve_tarea.json.data.status == 'stopped'
  retries: "{{ pve_tarea_intentos | default(60) }}"
  delay: 2
  changed_when: false

- name: la tarea del hipervisor terminó mal
  ansible.builtin.assert:
    that:
      - pve_tarea.json.data.exitstatus is defined
      - pve_tarea.json.data.exitstatus == 'OK'
    fail_msg: >-
      La API dijo {{ pve_tarea.json.data.exitstatus | default('sin estado') }} al
      {{ pve_do | default('ejecutar la tarea') }}. La salida de la tarea está en el
      informe del hipervisor; el motor no sigue a ciegas.
