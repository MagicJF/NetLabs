# PROPÓSITO:   la única puerta a un interior Linux: SSH a su dirección, con el salto
#              hecho por el servicio de gestión (nunca por dentro de un router).
# INVARIANTES: la clave y el puerto del túnel salen de netlabs.yml; la dirección es la
#              declarada, no la inventada.
#              Una lectura no cambia nada (`changed_when: false`).
# VER:         docs/diseno.md §4.3

# El túnel aterriza EN el servicio de gestión. Cuando el interior que se converge es
# ese mismo servicio, saltar hacia su propia dirección es un SSH que se abre a sí
# mismo y sshd lo corta con `stdio forwarding failed`: se entra directo por el túnel,
# sin `-W`. Cuando el interior es otro invitado, el salto sí hace falta.
- name: "SSH · {{ interior_descripcion | default(objetivo) }}"
  vars:
    interior_destino: "{{ 'root@' ~ objetivo if interior_salto | default(true) | bool else 'root@127.0.0.1' }}"
    interior_proxy: >-
      {{ [] if not interior_salto | default(true) | bool else
         ['-o', 'ProxyCommand=ssh -i ' ~ clave ~ ' -p ' ~ puerto | string ~
               ' -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -W %h:%p root@127.0.0.1'] }}
  ansible.builtin.command:
    argv: >-
      {{ ['ssh', '-i', clave, '-p', puerto | string,
          '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=no',
          '-o', 'UserKnownHostsFile=/dev/null', '-o', 'LogLevel=ERROR']
         + interior_proxy + [interior_destino] + comando }}
    # La clave de una credencial viaja por la entrada estándar, nunca por la
    # línea de órdenes: así no aparece en `ps` ni en el informe. El resto de
    # operaciones recibe una entrada vacía y no lee nada.
    stdin: "{{ interior_secreto | default('') }}"
  register: interior
  # Una tarea que toca una clave no imprime su salida.
  no_log: "{{ (interior_secreto | default('')) | length > 0 }}"
  # Una lectura no cambia nada; una escritura sí, y decirlo es lo que permite
  # comprobar que el segundo apply no escribe: si `changed` no es cero, quedó
  # una decisión tomada por accidente.
  changed_when: "{{ interior_escribe | default(false) | bool }}"

- name: "SSH · lo que dijo {{ objetivo }}"
  ansible.builtin.debug:
    var: interior.stdout_lines
