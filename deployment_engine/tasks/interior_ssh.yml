# PROPÓSITO:   la única puerta a un interior Linux: SSH a su dirección, con el salto
#              hecho por el servicio de gestión (nunca por dentro de un router).
# INVARIANTES: la clave y el puerto del túnel salen de netlabs.yml; la dirección es la
#              declarada, no la inventada.
#              Una lectura no cambia nada (`changed_when: false`).
#              Lo que la orden devuelve se imprime salvo que quien la pide lo calle
#              (`interior_imprime: false`), para las respuestas que traen una credencial.
# VER:         docs/diseno.md §4.3

# El túnel aterriza EN el servicio de gestión. Cuando el interior que se converge es
# ese mismo servicio, saltar hacia su propia dirección es un SSH que se abre a sí
# mismo y sshd lo corta con `stdio forwarding failed`: se entra directo por el túnel,
# sin `-W`. Cuando el interior es otro invitado, el salto sí hace falta.
- name: "SSH · {{ interior_descripcion | default(objetivo) }}"
  vars:
    interior_destino: "{{ 'root@' ~ objetivo if interior_salto | default(true) | bool else 'root@127.0.0.1' }}"
    # El SSH exterior va al invitado (`objetivo`), no al túnel: con salto, ese invitado
    # es el destino y su sshd escucha en 22 —`puerto` es sólo por donde el
    # `ProxyCommand` habla con 127.0.0.1, y `-W %h:%p` reenvía al puerto exterior—.
    # Sin salto, el túnel aterriza *dentro* del invitado y el puerto exterior sí es el
    # del túnel. Usar `puerto` en los dos casos apuntaba el SSH al puerto del túnel
    # cuando el destino era el invitado, y no era el suyo.
    interior_puerto_exterior: "{{ 22 if interior_salto | default(true) | bool else puerto }}"
    interior_proxy: >-
      {{ [] if not interior_salto | default(true) | bool else
         ['-o', 'ProxyCommand=ssh -i ' ~ clave ~ ' -p ' ~ puerto | string ~
               ' -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -W %h:%p root@127.0.0.1'] }}
  ansible.builtin.command:
    argv: >-
      {{ ['ssh', '-i', clave, '-p', interior_puerto_exterior | string,
          '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=no',
          '-o', 'UserKnownHostsFile=/dev/null', '-o', 'LogLevel=ERROR']
         + interior_proxy + [interior_destino] + comando }}
    # La clave de una credencial viaja por la entrada estándar, nunca por la
    # línea de órdenes: así no aparece en `ps` ni en el informe. El resto de
    # operaciones recibe una entrada vacía y no lee nada.
    stdin: "{{ interior_secreto | default('') }}"
  register: interior
  # Una tarea que toca una clave no imprime su salida.
  no_log: "{{ (interior_secreto | default('')) | length > 0 }}"
  # Una lectura no cambia nada; una escritura sí, y decirlo es lo que permite
  # comprobar que el segundo apply no escribe: si `changed` no es cero, quedó
  # una decisión tomada por accidente. Sin delimitadores: son condiciones, no
  # plantillas (con `{{ }}` Ansible las deja de aceptar).
  # Una tarea que escribe puede, aun así, no haber cambiado nada en el invitado
  # —ya estaba como debía—; quien la pide lo declara con `interior_cambia_salida`
  # y entonces manda la marca `CAMBIO:1` que imprimió el propio script.
  changed_when: >-
    (interior_escribe | default(false) | bool)
    and (not (interior_cambia_salida | default(false) | bool)
         or 'CAMBIO:1' in (interior.stdout | default('')))
  # Una puerta que se niega a fallar deja de ser una puerta: por defecto un
  # comando que sale con error para la tarea. Quien sondea —y necesita decidir
  # él qué hacer con el silencio— lo baja a propósito (`interior_falla: false`)
  # y lo dice en su propio mensaje.
  failed_when: >-
    (interior_falla | default(true) | bool)
    and (interior.rc | default(0) | int) != 0

- name: "SSH · lo que dijo {{ objetivo }}"
  ansible.builtin.debug:
    var: interior.stdout_lines
  # Una respuesta que trae una credencial no se imprime: quien la pide lo dice
  # (`interior_imprime: false`). Una lectura no lleva clave; una respuesta de un API
  # que devuelve la ficha de un equipo, sí. Y la tarea que recibió la clave por su
  # entrada estándar tampoco: `no_log` cala la salida de la tarea, pero este `debug`
  # es otra tarea y leería el mismo `stdout` —una credencial aplicada se ve en `ps`
  # si este aviso no calla—.
  when: >-
    (interior_imprime | default(true) | bool)
    and (interior_secreto | default('')) | length == 0
