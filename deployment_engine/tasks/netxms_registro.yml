# PROPÓSITO:   la vista tenga encendida la escucha de registros de los equipos, tal y como lo
#              declara el entorno (`observabilidad.registro`), porque encenderla no es cosa de un
#              laboratorio: es del mundo, como la identidad con la que se sondea (ADR 0019).
# INVARIANTES: se llama con `curl` desde DENTRO del invitado de gestión, por la puerta de siempre.
#              Una sola lectura —`GET /server-config`— y sólo se escribe la diferencia: una
#              escucha ya encendida no se vuelve a encender, y un `apply` repetido no escribe.
#              El **reinicio del servicio** no se adivina: la propia variable dice si su cambio lo
#              exige (`needServerRestart`), y sólo se reinicia si de verdad se escribió algo que lo
#              pide. Una escritura que no cambió nada no reinicia jamás.
#              Sin declaración en el entorno, este fichero no toca nada.
# VER:         docs/diseno.md §7; docs/decisiones/0021-el-registro-lo-escucha-la-vista.md

# --- entrar ----------------------------------------------------------------
# Se entra por la misma puerta que el resto de la vista (misma conversación, mismo idioma) en
# vez de dar por hecho que otro fichero dejó la sesión abierta: este se pueda incluir solo.
- name: netxms · entrar por el API del servicio de gestión
  include_tasks: netxms_entrar.yml

# --- leer lo que la vista tiene puesto --------------------------------------
- name: netxms · leer la configuración del servicio
  include_tasks: interior_ssh.yml
  vars:
    interior_descripcion: "netxms · leer la configuración del servicio"
    interior_salto: false
    objetivo: 127.0.0.1
    interior_escribe: false
    interior_secreto: "{{ netxms_testigo }}\n"
    interior_imprime: false
    comando: "{{ netxms_api | netlabs_netxms_configs_cmd }}"

- name: netxms · la configuración que devolvió la vista
  ansible.builtin.set_fact:
    netxms_configs: "{{ interior.stdout | default('[]', true) | from_json }}"
  no_log: true

# --- la diferencia con lo declarado ----------------------------------------
- name: netxms · la diferencia entre lo declarado y lo que la vista tiene puesto
  ansible.builtin.set_fact:
    netxms_registro_plan: >-
      {{ env.observabilidad.registro | default({}) | netlabs_netxms_registro_ops(
           netxms_configs | default([], true), netxms_api) }}
  no_log: true

- name: netxms · lo que hay que cambiar para que la vista recoja los registros
  ansible.builtin.debug:
    msg: "{{ netxms_registro_plan.ops | map(attribute='effect') | list }}"
  when: netxms_registro_plan.ops | length > 0

- name: netxms · decirle a la vista cómo recoger los registros
  include_tasks: interior_ssh.yml
  vars:
    interior_descripcion: "netxms · {{ netxms_conf_op.effect }}"
    interior_salto: false
    objetivo: 127.0.0.1
    interior_escribe: true
    interior_secreto: "{{ netxms_testigo }}\n{{ netxms_conf_op.cuerpo }}"
    interior_imprime: false
    comando: "{{ netxms_conf_op.cmd }}"
  loop: "{{ netxms_registro_plan.ops }}"
  loop_control: {loop_var: netxms_conf_op, label: "{{ netxms_conf_op.effect }}"}
  no_log: true
  when: netxms_registro_plan.ops | length > 0

# El servicio sólo lee esta variable al arrancar: si se escribió, hay que reiniciarlo. Que haga
# falta lo dice la propia variable, no una lista de nombres que el motor mantenga a mano.
- name: netxms · reiniciar el servicio para que el cambio surta efecto
  include_tasks: interior_ssh.yml
  vars:
    interior_descripcion: "netxms · reiniciar el servicio para que el cambio surta efecto"
    interior_salto: false
    objetivo: 127.0.0.1
    interior_escribe: true
    interior_cambia_salida: true
    comando: "{{ netlabs_netxms_reinicio_cmd() }}"
  when: netxms_registro_plan.reiniciar | bool

# Y no se da por bueno hasta que vuelve a atender: un servicio que se reinició y no levanta deja
# el `apply` en verde y la vista muerta, que es la peor de las mentiras.
- name: netxms · esperar a que el servicio vuelva a atender
  include_tasks: interior_ssh.yml
  vars:
    interior_descripcion: "netxms · esperar a que el servicio vuelva a atender"
    interior_salto: false
    objetivo: 127.0.0.1
    interior_escribe: false
    comando: "{{ ['/bin/sh', '-c', 'for i in $(seq 1 40); do ss -ltn 2>/dev/null | grep -q \":8000\" && echo LISTO && exit 0; sleep 3; done; exit 1'] }}"
  when: netxms_registro_plan.reiniciar | bool
