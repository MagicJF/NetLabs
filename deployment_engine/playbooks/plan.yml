# PROPÓSITO:   `plan`: leer el mundo y decir la diferencia, sin tocar nada.
#              Es el mismo cálculo que ejecuta `apply`; si aquí no sale, allí tampoco.
# INVARIANTES: sólo lecturas a la API.
# VER:         docs/diseno.md §7

- name: netlabs · plan
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    raiz: "{{ playbook_dir | dirname | dirname }}"
    env: "{{ lookup('file', raiz ~ '/netlabs.yml') | from_yaml }}"
    secrets: "{{ lookup('file', raiz ~ '/secrets.yml') | from_yaml }}"
    lab: "{{ lookup('file', raiz ~ '/labs/' ~ netlabs_lab ~ '/' ~ netlabs_lab ~ '.yml') | from_yaml }}"
  tasks:
    - include_tasks: ../tasks/world.yml

    - name: netlabs · calcular la diferencia
      ansible.builtin.set_fact:
        plan: "{{ world | netlabs_plan(lab, env) }}"

    - name: "plan · {{ plan.lab }}"
      ansible.builtin.debug:
        msg: "{{ ['pool ' ~ plan.pool] + plan.effects }}"

    - name: plan · nada que hacer
      ansible.builtin.debug:
        msg: "El mundo ya es lo declarado: el segundo apply no escribe."
      # La cuenta incluye lo que sobra: un plan que sólo mira lo que falta diría
      # "nada que hacer" con invitados de más dentro del pool.
      when: plan.steps | length == 0

    - name: guardar el plan para quien lo ejecute
      ansible.builtin.copy:
        content: "{{ plan | to_nice_json }}"
        dest: "{{ netlabs_plan_out }}"
        mode: "0600"
      # El plan es un artefacto local, no un cambio en el mundo: `plan` no escribe
      # nada en el hipervisor. Decir `changed` aquí ensuciaría la cuenta honesta.
      changed_when: false
      when: netlabs_plan_out is defined
