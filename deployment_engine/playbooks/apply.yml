# PROPÓSITO:   `apply`: converger el laboratorio declarado sobre el mundo leído.
#              Etapas: pool y puentes -> invitados -> arranque del router -> REST ->
#              direcciones de los puestos -> comprobación del cruce.
# INVARIANTES: si el camino hacia la gestión no está abierto, para y dice qué falta:
#              no lo abre él (eso es `apply --site`).
#              Sólo actúa sobre el pool y los puentes con la marca del laboratorio.
#              La segunda pasada no escribe: cada escritura está condicionada a la
#              diferencia calculada.
# VER:         docs/diseno.md §7, §8

- name: netlabs · apply
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    raiz: "{{ playbook_dir | dirname | dirname }}"
    env: "{{ lookup('file', raiz ~ '/netlabs.yml') | from_yaml }}"
    secrets: "{{ lookup('file', raiz ~ '/secrets.yml') | from_yaml }}"
    lab: "{{ lookup('file', raiz ~ '/labs/' ~ netlabs_lab ~ '/' ~ netlabs_lab ~ '.yml') | from_yaml }}"
    clave: "{{ env.management.tunnel.key | expanduser }}"
    puerto: "{{ env.management.tunnel.local_ssh_port }}"
    crear: "{{ plan.steps | selectattr('op', 'equalto', 'guest_create') | map(attribute='guest.vmid') | list }}"
  tasks:
    - include_tasks: ../tasks/world.yml

    - name: netlabs · calcular la diferencia
      ansible.builtin.set_fact:
        plan: "{{ world | netlabs_plan(lab, env) }}"

    - name: "apply · {{ plan.lab }}"
      ansible.builtin.debug:
        msg: "{{ ['pool ' ~ plan.pool] + plan.effects }}"

    - name: apply · lo que se va a crear en esta pasada
      ansible.builtin.set_fact:
        # Un invitado rehecho cuenta como nuevo: se retira y se vuelve a crear en esta
        # misma pasada, y luego se le espera igual que al que nace de cero.
        nuevos: "{{ (plan.steps | selectattr('op', 'equalto', 'guest_create') | map(attribute='guest.vmid') | list)
                    + (plan.steps | selectattr('op', 'equalto', 'guest_recreate') | map(attribute='vmid') | list) }}"
        puentes: "{{ plan.steps | selectattr('op', 'equalto', 'bridge_ensure') | list }}"
        puentes_sobrantes: "{{ plan.steps | selectattr('op', 'equalto', 'bridge_destroy') | list }}"
        sobrantes: "{{ plan.steps | selectattr('op', 'equalto', 'guest_destroy') | list }}"
        # Recursos escritos en el config de un invitado que ya existe: se para, se le
        # escribe el config y se le vuelve a arrancar. Sin tirar su disco.
        cambios: "{{ plan.steps | selectattr('op', 'equalto', 'guest_set') | list }}"
        rehacer: "{{ plan.steps | selectattr('op', 'equalto', 'guest_recreate') | list }}"

    # --- el camino ---------------------------------------------------------
    - name: apply · el camino hacia la gestión tiene que estar abierto
      ansible.builtin.command:
        argv: [ssh, -i, "{{ clave }}", -p, "{{ puerto }}", -o, BatchMode=yes,
               -o, StrictHostKeyChecking=no, -o, "UserKnownHostsFile=/dev/null",
               -o, ConnectTimeout=8, root@127.0.0.1, "true"]
      register: camino
      changed_when: false
      failed_when: false

    - name: apply · no hay camino hacia la red de gestión
      ansible.builtin.fail:
        msg: >-
          No hay camino hacia la red de gestión por 127.0.0.1:{{ puerto }}
          ({{ camino.stderr | trim }}). El servicio de gestión no está en pie:
          ejecuta `./netlabs apply --site` y vuelve.
      when: camino.rc != 0

    # --- el pool y los puentes --------------------------------------------
    - include_tasks: ../tasks/pve.yml
      vars:
        pve_method: POST
        pve_path: /pools
        pve_body: {poolid: "{{ plan.pool }}", comment: "netlabs lab={{ plan.lab }}"}
        pve_do: "crear el pool {{ plan.pool }}"
      when: plan.steps | selectattr('op', 'equalto', 'pool_ensure') | list | length > 0

    - include_tasks: ../tasks/pve.yml
      vars:
        pve_method: POST
        pve_path: "/nodes/{{ env.proxmox.node }}/network"
        pve_body: {iface: "{{ item.bridge }}", type: bridge, autostart: 1, comments: "{{ item.comment }}"}
        pve_do: "crear el puente {{ item.bridge }}"
        pve_status: [200]
      loop: "{{ puentes }}"
      loop_control: {label: "{{ item.bridge }}"}
      when: puentes | length > 0

    - include_tasks: ../tasks/pve.yml
      vars:
        pve_method: PUT
        pve_path: "/nodes/{{ env.proxmox.node }}/network"
        pve_do: "aplicar las redes del nodo"
        pve_status: [200]
      when: puentes | length > 0

    - include_tasks: ../tasks/wait_task.yml
      vars:
        upid: "{{ pve_r.json.data }}"
        pve_do: "aplicar las redes del nodo"
      when: puentes | length > 0

    # --- lo que sobra ------------------------------------------------------
    # Primero se retira lo que la declaración no pide: si un invitado viejo ocupa el
    # nombre o la dirección de uno nuevo, crear antes que retirar choca. Y si el
    # retiro falla, es mejor saberlo antes de haber creado nada.
    # El título no puede citar `item`: ansible lo plantilla antes del bucle y deja
    # un error de plantilla en el nombre de la tarea. El nombre va en el `label`.
    - name: "apply · retirar lo que sobra en el pool"
      include_tasks: ../tasks/destroy_guest.yml
      vars:
        guest: "{{ item }}"
      loop: "{{ sobrantes }}"
      loop_control: {label: "{{ item.name }} ({{ item.vmid }})"}
      when: sobrantes | length > 0

    # Un invitado que no se arregla en caliente —de máquina virtual a contenedor, o con
    # otro nombre— se retira SÓLO ese y se vuelve a crear abajo, con el resto del
    # laboratorio intacto. Antes esto costaba un `destroy` del laboratorio entero.
    - name: "apply · retirar los que se rehacen (sólo esos)"
      include_tasks: ../tasks/destroy_guest.yml
      vars:
        guest: "{{ item }}"
      loop: "{{ rehacer }}"
      loop_control: {label: "{{ item.name }} ({{ item.vmid }})"}
      when: rehacer | length > 0

    # Los cables que ya no se declaran se retiran después de los invitados que
    # sobraban: si un invitado viejo aún colgaba de un cable viejo, primero se
    # apaga y se borra, y sólo entonces desaparece el cable.
    - name: "apply · retirar los cables que ya no se declaran"
      include_tasks: ../tasks/pve.yml
      vars:
        pve_method: DELETE
        pve_path: "/nodes/{{ env.proxmox.node }}/network/{{ item.bridge }}"
        pve_do: "retirar el cable {{ item.bridge }}"
        pve_status: [200]
      loop: "{{ puentes_sobrantes }}"
      loop_control: {label: "{{ item.bridge }}"}
      when: puentes_sobrantes | length > 0

    - include_tasks: ../tasks/pve.yml
      vars:
        pve_method: PUT
        pve_path: "/nodes/{{ env.proxmox.node }}/network"
        pve_do: "aplicar las redes del nodo"
        pve_status: [200]
      when: puentes_sobrantes | length > 0

    - include_tasks: ../tasks/wait_task.yml
      vars:
        upid: "{{ pve_r.json.data }}"
        pve_do: "aplicar las redes del nodo"
      when: puentes_sobrantes | length > 0

    # --- los invitados -----------------------------------------------------
    - name: apply · los invitados que faltan
      include_tasks: ../tasks/create_guest.yml
      loop: "{{ plan.nodes }}"
      loop_control: {label: "{{ item.name }}"}
      vars:
        guest: "{{ item }}"
      when: item.vmid in nuevos

    # Los recursos, en el sitio: no hay globo de memoria, así que el invitado se para
    # un momento, se le escribe el config y se le vuelve a arrancar. Su disco, sus
    # cables y su configuración de dentro siguen donde estaban.
    - name: apply · los invitados a los que les cambian los recursos
      include_tasks: ../tasks/guest_set.yml
      loop: "{{ cambios }}"
      loop_control: {label: "{{ item.name }} ({{ item.vmid }})"}
      vars:
        cambio: "{{ item }}"
      when: cambios | length > 0

    # Un invitado que existe y está parado no se arranca al ajustarle los recursos —su
    # `guest_set` sólo devuelve a la vida al que ya lo estaba—, así que el arranque que el
    # plan pide se ejecuta aquí, antes de esperarlos: la espera de abajo exige que estén en
    # pie, y sin este paso agotaba su tope contra un invitado que nadie iba a arrancar.
    - name: apply · el arranque de los invitados que el plan manda arrancar
      include_tasks: ../tasks/start_guest.yml
      # Los dos caminos que dejan a un invitado apagado teniendo que estar en pie: un
      # `guest_start` del plan (existía, estaba parado y no cambia nada) y un `guest_set`
      # sobre uno que estaba parado (se le escriben los recursos y nadie lo arranca). Sin
      # el segundo, la espera de abajo agotaba su tope contra un invitado que nadie iba a
      # levantar. Los recién creados y los rehechos ya se arrancan en su propia tarea.
      loop: "{{ arranques }}"
      loop_control: {loop_var: arranque, label: "{{ arranque }}"}
      vars:
        arranques: >-
          {{ (plan.steps | selectattr('op', 'equalto', 'guest_start') | map(attribute='vmid') | list)
             + (cambios | rejectattr('status', 'equalto', 'running') | map(attribute='vmid') | list) }}
        guest: "{{ plan.nodes | selectattr('vmid', 'equalto', arranque) | first }}"
      when: arranques | length > 0

    - name: apply · los invitados que ya existían tienen que estar en pie
      include_tasks: ../tasks/wait_running.yml
      loop: "{{ plan.nodes }}"
      loop_control: {label: "{{ item.name }}"}
      vars:
        guest: "{{ item }}"
      when: item.vmid not in nuevos

    # --- el router ---------------------------------------------------------
    # El arranque no es cosa de "recién creado": un router que perdió su dirección
    # —o que nació con el arranque a medias— sigue sin red. Se pregunta al agente
    # si ya la tiene; sólo se arranca al que no. Preguntar es una lectura; arrancar
    # es una escritura, y por eso el segundo apply no escribe.
    - name: apply · ¿los routers ya tienen su dirección de gestión?
      include_tasks: ../tasks/router_address.yml
      loop: "{{ plan.nodes | selectattr('management') | list }}"
      loop_control: {label: "{{ item.name }}"}
      vars:
        guest: "{{ item }}"

    - name: apply · el arranque de los routers
      include_tasks: ../tasks/bootstrap_router.yml
      loop: "{{ plan.nodes | selectattr('management') | list }}"
      loop_control: {label: "{{ item.name }}"}
      vars:
        guest: "{{ item }}"
      when: item.vmid not in (routers_con_direccion | default([]))

    # --- el interior del router, por REST ---------------------------------
    - name: apply · el interior de los routers
      include_tasks: ../tasks/ros.yml
      loop: "{{ plan.nodes | selectattr('management') | list }}"
      loop_control: {label: "{{ item.name }}"}
      vars:
        router: "{{ item }}"
        ros_user: "{{ (item.configure.users | default([{'name': 'admin'}]))[0].name }}"

    # --- el registro de los equipos en lo que observa el sitio -------------
    # Va después del interior del router y no antes: la credencial que se registra es
    # la que el router ya tiene puesta (la pone su REST), no una que valdrá más tarde.
    # Y va pronto en el apply: un equipo que nace se registra antes de que lo descubra
    # el censo del observador, que es cuando ya no se puede hacer — su API sólo acepta
    # las credenciales al crear el equipo.
    # Las direcciones con las que se clasifica el registro se leen AHORA y no al principio
    # de la pasada: esta misma pasada ha creado y retirado invitados, y una dirección que
    # acaba de nacer no estaba en la lectura vieja —el alta de un equipo chocaba entonces
    # con el registro histórico que aún ocupaba su dirección, y el API devolvía 409 después
    # de haber creado el invitado—. La lectura dice quién tiene cada dirección; quién es el
    # dueño de un registro lo sigue diciendo su marca.
    - name: apply · los invitados que hay ahora, antes de registrar
      include_tasks: ../tasks/read_guests.yml
      when: plan.steps | selectattr('op', 'equalto', 'netxms_registro') | list | length > 0

    - name: apply · el registro de los equipos en lo que observa el sitio
      include_tasks: ../tasks/netxms.yml
      vars:
        equipos: "{{ plan.nodes | selectattr('management') | list }}"
        # Las direcciones que hoy tiene algún invitado del clúster: separan un resto de
        # un despliegue anterior de un equipo de otro laboratorio que se llame igual.
        vivas: "{{ invitados_ahora | netlabs_direcciones_vivas(env.management.address_space) }}"
        # Y las de los invitados de este laboratorio: las de sus equipos de red no bastan,
        # porque una estación de trabajo tampoco se registra y su dirección es de aquí.
        propias: >-
          {{ invitados_ahora | selectattr('pool', 'equalto', plan.pool) | list
             | netlabs_direcciones_vivas(env.management.address_space) }}
      when: plan.steps | selectattr('op', 'equalto', 'netxms_registro') | list | length > 0

    # --- el mapa del laboratorio en lo que observa el sitio -----------------
    # Después del registro y no antes: un elemento del mapa se apoya en un equipo que la
    # vista ya conoce, y el registro es quien los da de alta. El mapa se coloca donde lo
    # pone el plano (`plano.py`), así que la vista y la documentación enseñan lo mismo.
    - name: apply · el mapa del laboratorio en lo que observa el sitio
      include_tasks: ../tasks/netxms_mapa.yml
      vars:
        equipos: "{{ plan.nodes | selectattr('management') | list }}"
      when: plan.steps | selectattr('op', 'equalto', 'netxms_mapa') | list | length > 0

    # --- el interior de los nodos de control, por SSH ----------------------
    # Un nodo de control no tiene router ni DHCP: su interior se converge por SSH
    # con la misma puerta que usa el resto del motor. Sólo se escribe la diferencia.
    - name: "apply · el interior de los nodos de control"
      include_tasks: ../tasks/linux_interior.yml
      loop: "{{ plan.nodes | selectattr('control', 'defined') | selectattr('control') | list }}"
      loop_control: {loop_var: linux_nodo, label: "{{ linux_nodo.name }}"}
      vars:
        objetivo: "{{ linux_nodo.mgmt_address }}"
        linux_descripcion: "{{ linux_nodo.name }}"
      when: linux_nodo.configure | default({}) | length > 0

    # --- los puestos toman dirección --------------------------------------
    - name: "apply · la dirección de cada puesto"
      include_tasks: ../tasks/check_lease.yml
      vars:
        guest: "{{ puesto }}"
      loop: "{{ plan.nodes | rejectattr('management') | rejectattr('control', 'defined') | list }}"
      # El nombre del bucle no puede ser `item`: el fichero incluido usa `item` y
      # éste lo pisaría. Y el nombre de la tarea no puede citar `item` antes de
      # existir: ansible lo intenta y deja un error de plantilla en el título.
      loop_control: {loop_var: puesto, label: "{{ puesto.name }}"}

    # --- las rutas hacia las redes del laboratorio -------------------------
    # Van después de que los routers tengan su dirección de gestión: el salto de
    # una ruta es esa dirección, y una ruta hacia un salto que no responde no es
    # una ruta. Las pone el invitado de gestión, que es por donde entra el SSH del
    # motor y donde vive lo que observa; `destroy` las retira.
    - name: apply · las rutas hacia las redes del laboratorio
      include_tasks: ../tasks/rutas.yml
      vars:
        rutas_deseadas: "{{ plan.rutas | default([]) }}"
        espacios: "{{ lab.address_spaces | default([]) }}"

    # --- el cruce ---------------------------------------------------------
    # Y se comprueba: una ruta puesta no es una red alcanzable. Si el router no
    # deja pasar el tráfico de la gestión, el laboratorio se despliega y no se ve,
    # y eso se dice aquí en vez de descubrirlo en la consola de NetXMS.
    - name: apply · el cruce desde la gestión hacia cada red del laboratorio
      include_tasks: ../tasks/cruce.yml
      loop: "{{ plan.rutas | default([]) }}"
      loop_control: {loop_var: cruce, label: "{{ cruce.space }}"}

    - name: apply · el laboratorio está desplegado
      ansible.builtin.debug:
        msg: "{{ plan.nodes | map(attribute='name') | list }} en {{ plan.pool }}"
