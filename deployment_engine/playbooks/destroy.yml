# PROPÓSITO:   `destroy`: retirar lo que el laboratorio declaró y lleva su marca.
#              Nada más. Lo que no está declarado es de otro y no se toca.
#              Se retira de TODOS los sitios donde lo declarado dejó rastro: el
#              hipervisor (invitados, puentes, pool), el invitado de gestión (las rutas
#              hacia sus redes) y la vista (sus equipos y su mapa). Un destroy que deja
#              equipos en rojo y un mapa de una red apagada no distingue «destruido» de
#              «desplegado».
# INVARIANTES: se borra por pool y por marca (`netlabs lab=<lab>`), nunca "todo lo
#              parado" ni "lo que sobra".
#              Las rutas hacia sus redes se retiran de la misma marca: son las que
#              caen dentro de los espacios que el laboratorio declaraba.
#              La vista se desmonta ANTES de tocar el hipervisor: si no se puede, el
#              laboratorio queda entero en vez de quedar medio destruido.
#              Si algo no se puede borrar, se para y se dice qué quedó.
# VER:         docs/diseno.md §7; docs/decisiones/0014-el-destroy-tambien-desmonta-la-vista.md;
#              AGENTS.md §3.6

- name: netlabs · destroy
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    raiz: "{{ playbook_dir | dirname | dirname }}"
    env: "{{ lookup('file', raiz ~ '/netlabs.yml') | from_yaml }}"
    secrets: "{{ lookup('file', raiz ~ '/secrets.yml') | from_yaml }}"
    lab: "{{ lookup('file', raiz ~ '/labs/' ~ netlabs_lab ~ '/' ~ netlabs_lab ~ '.yml') | from_yaml }}"
    clave: "{{ env.management.tunnel.key | expanduser }}"
    puerto: "{{ env.management.tunnel.local_ssh_port }}"
  tasks:
    - include_tasks: ../tasks/world.yml

    # El laboratorio de control no es un laboratorio efímero: su invitado es el
    # servicio persistente que observa el sitio (NetXMS), con su base y su histórico,
    # y sobrevive a cualquier destroy (docs/diseno.md §2.4, §3.4-§3.5). Su pool se
    # llama como él, así que sin esta puerta se seleccionaría como propio y se
    # borraría con purge. Se rechaza ANTES de tocar nada.
    - name: destroy · el servicio persistente no se destruye desde aquí
      ansible.builtin.assert:
        that: lab.kind | default('topology') != 'control'
        fail_msg: >-
          `{{ lab.lab }}` es el laboratorio de control (kind: control) y su invitado es el
          servicio persistente: no es un laboratorio efímero y no se retira desde la
          herramienta. Lo persistente sobrevive a los destroy de los demás.

    - name: destroy · calcular qué es de este laboratorio
      ansible.builtin.set_fact:
        pool: "{{ lab.lab }}"
        marca: "netlabs lab={{ lab.lab }}"
        puentes: "{{ world.bridges | selectattr('comments', 'search', 'netlabs lab=' ~ lab.lab) | list }}"
        suyos: "{{ world.invitados | selectattr('pool', 'equalto', lab.lab) | list }}"

    - name: "destroy · {{ lab.lab }}"
      ansible.builtin.debug:
        msg: >-
          {{ ['se retiran ' ~ (suyos | length | string) ~ ' invitados del pool ' ~ pool,
              'y los puentes ' ~ (puentes | map(attribute='iface') | list | join(', ') if puentes else 'ninguno')] }}

    - name: destroy · lo que no es de este laboratorio no se toca
      ansible.builtin.assert:
        that: >-
          suyos | selectattr('pool', 'ne', pool) | list | length == 0
        fail_msg: "El filtro de propiedad está mal: se ha colado un invitado ajeno."

    # --- la vista ----------------------------------------------------------
    # Lo primero, y a propósito: si la vista no se puede desmontar, el destroy se para
    # antes de tocar Proxmox y el laboratorio queda entero y coherente —no medio
    # destruido—. Lo último que se toca, lo primero que se comprueba.
    - name: destroy · retirar el laboratorio de la vista
      include_tasks: ../tasks/netxms_retirar.yml

    # --- invitados ---------------------------------------------------------
    # Un invitado por pasada, en su propio fichero: parar, esperar a que pare,
    # borrar con purge y esperar a que el borrado termine. El sondeo va dentro de
    # la puerta porque `until` no es válido sobre un `include_tasks` (medido).
    - name: "destroy · retirar {{ item.name }}"
      include_tasks: ../tasks/destroy_guest.yml
      vars:
        guest: "{{ item }}"
      loop: "{{ suyos }}"
      loop_control: {label: "{{ item.name }}"}
      when: suyos | length > 0

    # --- puentes -----------------------------------------------------------
    - name: "destroy · borrar el puente {{ item.iface }}"
      include_tasks: ../tasks/pve.yml
      vars:
        pve_method: DELETE
        pve_path: "/nodes/{{ env.proxmox.node }}/network/{{ item.iface }}"
        pve_do: "borrar el puente {{ item.iface }}"
        pve_status: [200]
      loop: "{{ puentes }}"
      loop_control: {label: "{{ item.iface }}"}
      when: puentes | length > 0

    - name: destroy · aplicar el cambio de redes
      include_tasks: ../tasks/pve.yml
      vars:
        pve_method: PUT
        pve_path: "/nodes/{{ env.proxmox.node }}/network"
        pve_do: "aplicar las redes del nodo"
        pve_status: [200]
      when: puentes | length > 0

    - name: destroy · esperar al cambio de redes
      include_tasks: ../tasks/wait_task.yml
      vars:
        upid: "{{ pve_r.json.data }}"
        pve_do: "aplicar las redes del nodo"
      when: puentes | length > 0

    # --- pool --------------------------------------------------------------
    - name: "destroy · borrar el pool {{ pool }}"
      include_tasks: ../tasks/pve.yml
      vars:
        pve_method: DELETE
        pve_path: "/pools/{{ pool }}"
        pve_do: "borrar el pool {{ pool }}"
        pve_status: [200]
      when: pool in (world.pools | default([]))

    # --- las rutas ---------------------------------------------------------
    # Las rutas hacia las redes del laboratorio viven en el invitado de gestión y
    # apuntan a espacios que este laboratorio declaraba: son suyas y se retiran con
    # lo demás. Si se quedaran, el invitado seguiría enrutando hacia una red que ya
    # no existe; si no se pueden retirar, se para y se dice qué quedó.
    - name: destroy · retirar las rutas hacia las redes del laboratorio
      include_tasks: ../tasks/rutas.yml
      vars:
        rutas_deseadas: []
        espacios: "{{ lab.address_spaces | default([]) }}"

    # --- la comprobación que cuenta ---------------------------------------
    - include_tasks: ../tasks/world.yml

    - name: destroy · no puede quedar nada del laboratorio
      ansible.builtin.assert:
        that:
          - (world.invitados | selectattr('pool', 'equalto', pool) | list | length) == 0
          - (world.bridges | selectattr('comments', 'search', marca) | list | length) == 0
          - pool not in (world.pools | default([]))
          - (netxms_quedan | default([]) | length) == 0
          - (netxms_mapa_queda.id | default(0) | int) == 0
        fail_msg: >-
          Después de destruir queda algo del laboratorio {{ lab.lab }}:
          invitados {{ world.invitados | selectattr('pool', 'equalto', pool) | map(attribute='name') | list }},
          puentes {{ world.bridges | selectattr('comments', 'search', marca) | map(attribute='iface') | list }},
          pool {{ pool }} {{ 'presente' if pool in (world.pools | default([])) else 'ausente' }},
          equipos en la vista {{ netxms_quedan | default([]) | map(attribute='name') | list }}
          y su mapa {{ 'todavía presente' if (netxms_mapa_queda.id | default(0) | int) != 0 else 'ausente' }}.

    - name: destroy · limpio
      ansible.builtin.debug:
        msg: >-
          No queda nada de {{ lab.lab }}: ni invitados, ni puentes, ni pool en Proxmox,
          ni equipos ni mapa en la vista.
