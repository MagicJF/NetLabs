# Netlabs · configuración del entorno
#
# Lo que hay aquí NO es un laboratorio: es el mundo donde los laboratorios viven.
# El motor lo lee para saber a quién preguntar y de dónde derivar; ningún valor de
# ningún laboratorio puede aparecer en este fichero.
#
# Las credenciales viven en `secrets.yml` (ignorado por git). Esto es lo demás.

engine: 1

proxmox:
  node: Proxmox                 # el nodo del clúster; la API lo confirma al leer
  verify_tls: false             # certificado propio del nodo: se acepta y se dice
  storage: local                # plantillas e imágenes
  storage_guests: local-zfs     # discos de los invitados
  template_lxc: local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst
  template_router: chr-7.25.1.raw   # imagen de fábrica del CHR, importada al crear

# La red de gestión (OOB): una sola, compartida por todos los laboratorios, que no
# pertenece a ninguno. El motor la crea si no está y la marca como suya; no la
# replantea en cada despliegue y `destroy` de un laboratorio no la toca.
management:
  bridge: vmbr30
  address_space: 10.30.0.0/16
  gateway: 10.30.0.1
  # El invitado de gestión vive en el pool del laboratorio de control que lo
  # declara (`a_bootstrap`), y ese pool se llama como el laboratorio: la letra por
  # la que empieza el nombre es lo que la API de Proxmox exige de un pool.
  pool: a_bootstrap
  guest: netxms
  cores: 2
  memory: 4096
  disk: 16
  # Puertos del túnel inverso que el invitado persistente abre hacia el nodo de
  # control (por el 443, que es lo único que el cortafuegos de casa deja entrar).
  # De aquí NO cuelga nada de un laboratorio: el camino base es uno y no cambia.
  tunnel:
    local_ssh_port: 2210
    local_web_port: 8443
    key: ~/.ssh/netlabs_tunnel   # la clave con la que el servicio vuelve a casa
  # El API del servicio de gestión, tal y como se ve **desde dentro de su invitado**:
  # ahí aterriza el túnel y por ahí entra el motor para registrar cada equipo del
  # laboratorio con su credencial (la quinta vía, docs/diseno.md §2.8). El usuario y la
  # clave salen de `secrets.yml` (`credenciales.netxms`), nunca de aquí.
  api: http://127.0.0.1:8000/v1

# La salida a la red pública: por dónde se asoma de verdad el laboratorio que la
# declare. Tampoco es suya —es del entorno—, pero se crea una por sede y laboratorio
# (`<letra>_<red>`), cada una con su tramo, para que dos sedes no compartan nunca el
# mismo cable. La traducción y el filtro del nodo son de todo el espacio
# (docs/decisiones/0018; el 0001 es el mismo caso con la red de gestión), así que no
# se tocan por laboratorio: los pone una vez el propio motor que las crea.
salida:
  address_space: 172.30.0.0/16
  # La pata pública del nodo: por aquí sale la traducción. El motor sólo la mira.
  uplink: vmbr0

# El resolutor del sitio: a quién preguntan los routers de cada sede por lo que no saben.
# Es una decisión del ENTORNO, no de un laboratorio: un sitio resuelve de una manera y un
# laboratorio no elige con qué —igual que no elige la identidad SNMP con la que se le mira
# (ADR 0019)—, así que se declara aquí una sola vez y los laboratorios sólo dicen si sus
# sedes resuelven (`dns: {enabled}`, ADR 0024).
#
# La dirección tiene que ser alcanzable desde la pata de salida de la sede: los routers
# reenvían por ahí y el nodo Proxmox traduce ese espacio hacia su enlace público (ADR 0018),
# así que un resolutor público llega sin abrir nada más. No puede ser la red de gestión ni
# el propio hipervisor: por la salida no se vuelve a casa (ADR 0018), y preguntarles no
# resolvería un nombre de fuera. El valor no es un secreto: por eso vive aquí y no en
# `secrets.yml`.
dns:
  servers: [9.9.9.9, 1.1.1.1]

# Rangos de identificadores: el más bajo libre del clúster, nunca uno ya usado.
vmids:
  min: 100
  max: 9999

# Un invitado de laboratorio se nombra como su equipo: dos letras de tipo, una de
# función y el ordinal (`rte1`, `swc2`), y ese mismo nombre es su hostname, su
# nombre en Proxmox y la punta de sus cables. El código de cada tipo vive en
# `TYPES` (deployment_engine/tools/identity.py), que es la única traducción.

# Cómo se mira a los equipos. Esto NO es un laboratorio: es el mundo. Un laboratorio
# no elige cómo le miran —lo declara su área `snmp: {enabled}`, y nada más—, y el
# motor aplica esto a cada equipo RouterOS que despliega y a su ficha en la vista.
#
# El P0 de la observabilidad (ADR 0019) retira la comunidad v2c en claro y la
# sustituye por SNMP v3 con autenticación y cifrado. La identidad se nombra aquí y su
# valor vive en `secrets.yml`: el entorno no escribe secretos, los señala.
observabilidad:
  snmp:
    version: 3
    credencial_from: secrets.snmp_v3

  # El valor de esa credencial no se escribe aquí: vive en `secrets.yml`, que está en
  # `.gitignore`. Es un mapa con estos cinco campos —y ninguno más—, y el motor lo comprueba
  # al resolver la identidad (`deployment_engine/tools/converge.py`), no al leer este fichero:
  #
  #   snmp_v3:
  #     usuario: nombre-seco            # 1..32 caracteres, sin espacios; en RouterOS ES el nombre
  #     autenticacion: SHA256           # MD5 | SHA1 | SHA256 | SHA512
  #     clave_autenticacion: *********  # 8 caracteres o más
  #     cifrado: AES                    # DES | AES (`AES` es AES-128)
  #     clave_cifrado: *********        # 8 caracteres o más
  #
  # Un equipo que no sepa v3 se mira con la comunidad v2c: entonces `version: 2` y
  # `credencial_from: secrets.snmp_comunidad` arriba, y
  # `snmp_comunidad: una-cadena-de-1-a-32-caracteres-sin-espacios` en `secrets.yml`.
  # El `credencial_from` hay que cambiarlo también: de él sale el nombre de la clave que
  # se resuelve, y con `secrets.snmp_v3` el motor buscaría una comunidad donde hay un
  # bloque v3 y pararía antes de desplegar.

  # Y los equipos mandan sus registros a la vista, que los escucha. Se declara aquí y no en un
  # laboratorio por el mismo motivo que la identidad de arriba: no es de un sitio, es de cómo se
  # mira a los equipos en todo el sitio. El puerto se puede omitir —514, el de siempre— y
  # `recoger: false` apaga la escucha en vez de dejarla a medias.
  registro:
    recoger: true
    puerto: 514
