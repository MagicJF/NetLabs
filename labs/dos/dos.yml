# Laboratorio `dos` · varios equipos de red en un solo dominio
#
# El segundo laboratorio pequeño: un router de borde, dos switches y dos puestos.
# Existe para ver la frontera entre enrutar y conmutar con los ojos:
#
#   rt-borde --- sw-nucleo --- sw-acceso --- ws-pc-1
#                                   \-------- ws-pc-2
#
# Todo el laboratorio es UN dominio de difusión (`lan`, 10.46.1.0/24). El router
# sólo tiene una pata en él: si tuviera dos, estaría conmutando y sería un switch.
# Los que reparten el cable son los switches, cada uno con su puente dentro de su
# RouterOS y su pata de gestión FUERA del puente.
#
# El identificador de cada nodo lleva el slot (slot 1 -> rt11, sw11, ws11) y el
# nombre de cada cable lleva sus dos puntas, así que este laboratorio no choca con
# `uno` en el mismo hipervisor. Ningún número derivado se declara: ni vmid, ni MAC,
# ni dirección de gestión.

lab: dos
slot: 1

# Espacio disjunto del resto: el plan lo comprueba contra lo que ya vive en el nodo.
address_spaces:
  - 10.46.0.0/16

networks:
  - name: lan
    address: 10.46.1.0/24

nodes:
  - role: borde
    type: router
    stage: 1
    resources: {cores: 1, memory: 256, disk: 1}
    networks: [lan]
    address: 10.46.1.1/24
    configure:
      identity: {name: rt-borde}
      addresses:
        - {network: lan, address: 10.46.1.1/24}
      dhcp_server:
        - {network: lan, pool: 10.46.1.100-10.46.1.199, gateway: 10.46.1.1}
      users:
        - {name: admin, password_from: secrets.routeros_clave}
      services: {www: true}
      snmp: {enabled: true, community_from: secrets.snmp_comunidad}

  # Los switches no declaran dirección de laboratorio: su gestión es la pata OOB
  # derivada del vmid. Todas sus patas son de la misma red porque un switch no une
  # redes; eso lo hace el router.
  - role: nucleo
    type: switch
    stage: 2
    after: [borde]
    resources: {cores: 1, memory: 256, disk: 1}
    networks: [lan, lan]
    configure:
      identity: {name: sw-nucleo}
      users:
        - {name: admin, password_from: secrets.routeros_clave}
      snmp: {enabled: true, community_from: secrets.snmp_comunidad}

  - role: acceso
    type: switch
    stage: 2
    after: [nucleo]
    resources: {cores: 1, memory: 256, disk: 1}
    networks: [lan, lan, lan]
    configure:
      identity: {name: sw-acceso}
      users:
        - {name: admin, password_from: secrets.routeros_clave}
      snmp: {enabled: true, community_from: secrets.snmp_comunidad}

  - role: pc-1
    type: workstation
    stage: 3
    after: [acceso]
    resources: {cores: 1, memory: 256, disk: 2}
    networks: [lan]
    address: dhcp

  - role: pc-2
    type: workstation
    stage: 3
    after: [acceso]
    resources: {cores: 1, memory: 256, disk: 2}
    networks: [lan]
    address: dhcp

links:
  - a: {node: borde, port: 1}
    z: {node: nucleo, port: 1}
  - a: {node: nucleo, port: 2}
    z: {node: acceso, port: 1}
  - a: {node: acceso, port: 2}
    z: {node: pc-1, port: 1}
  - a: {node: acceso, port: 3}
    z: {node: pc-2, port: 1}
